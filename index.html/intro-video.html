<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Intro Video</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:black;
}

/* FULL SCREEN VIDEO */
#introVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
}

/* SMOOTH FADE */
.fade-out{
animation:fadeOut 1s forwards;
}

@keyframes fadeOut{
to{
opacity:0;
}
}
/* =========================
   MOBILE RESPONSIVE
========================= */

@media (max-width: 768px){

body{
overflow-x:hidden;
}

/* Sections */
section{
padding:20px 15px;
}

/* Headings */
h1{
font-size:2rem !important;
line-height:1.3;
}

h2{
font-size:1.5rem !important;
line-height:1.4;
}

p{
font-size:0.95rem !important;
line-height:1.8;
}

/* Buttons */
.btn,
.back-btn{
padding:10px 18px;
font-size:0.9rem;
}

/* Glass cards */
.glass-box,
.letter-box,
.audio-card{
width:95% !important;
padding:20px !important;
}

/* Images */
img{
max-width:100%;
height:auto;
}

/* Teacher Photo */
.teacher-photo{
width:140px !important;
height:140px !important;
}

/* Rain Photos */
.rain-photo{
width:110px !important;
height:150px !important;
}

/* Story text */
#songContent{
font-size:0.95rem !important;
line-height:1.8 !important;
}

/* Fix fixed buttons */
#nextBtn,
#prevBtn,
#homeBtn{
bottom:15px;
}

/* Welcome title */
.title{
white-space:normal !important;
font-size:1.8rem !important;
padding:0 10px;
}

}
</style>
</head>

<body>

<!-- VIDEO -->
<video autoplay playsinline id="introVideo">
<source src="assets/New Video.mp4" type="video/mp4">
</video>

<script>

const video = document.getElementById("introVideo");

/* START VIDEO */
video.play().catch(()=>{});

/* AFTER 5 SECONDS */
setTimeout(()=>{

document.body.classList.add("fade-out");

setTimeout(()=>{

window.location.href = "welcome.html";

},1000);

},5000);

</script>

</body>
</html>
