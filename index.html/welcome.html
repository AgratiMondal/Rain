<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Welcome</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
    /* ===== GLASS WORD STYLE ===== */

.word{
display:inline-block;
margin:3px;
padding:6px 10px;

background:rgba(255,255,255,0.08);
backdrop-filter:blur(6px);
-webkit-backdrop-filter:blur(6px);

border-radius:8px;
border:1px solid rgba(255,255,255,0.2);

box-shadow:0 6px 15px rgba(0,0,0,0.3);

font-family:'Playfair Display',serif;

/* better 3D for letters */
transform:perspective(600px) translateZ(0);
transition:0.3s;
}
.word{
margin:2px;
padding:5px 8px;
}

.word:hover{
transform:perspective(800px) rotateX(5deg) rotateY(5deg) scale(1.05);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
font-family:'Playfair Display',serif;
color:white;

}

/* ===== BACKGROUND ===== */

#bgVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

/* soft romantic overlay */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.6));
z-index:-1;
}

/* ===== CENTER CONTENT ===== */

.container{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}
.container{
max-width:95%;
margin:auto;
}
/* ===== TYPEWRITER TEXT ===== */

.title{
font-size:3rem;
margin-bottom:40px;
letter-spacing:1px;
text-shadow:0 10px 30px rgba(0,0,0,0.7);
.title{
font-size:clamp(20px, 4vw, 48px);
}

/* 3D effect */
transform:perspective(800px) rotateX(10deg);
}
.title{
white-space:nowrap;   /* 🔥 FORCE ONE LINE */
overflow:hidden;
text-align:center;
}
/* ===== GLASS BUTTON ===== */

.btn{
padding:15px 30px;
font-size:1rem;
border:none;
cursor:pointer;

/* glass effect */
background:rgba(255,255,255,0.08);
backdrop-filter:blur(8px);
border:1px solid rgba(255,255,255,0.2);
color:white;
border-radius:12px;

/* 3D effect */
box-shadow:0 10px 25px rgba(0,0,0,0.4);
transform:perspective(600px) translateY(0);

transition:0.3s;
}

.btn:hover{
transform:translateY(-5px) scale(1.05);
box-shadow:0 20px 40px rgba(0,0,0,0.6);
}

</style>
</head>

<body>

<!-- Romantic Background Video -->
<video autoplay muted loop playsinline id="bgVideo">
  <source src="assets/love-bg.mp4" type="video/mp4">
</video>
<audio id="typeSound">
  <source src="assets/typeSound.mp3" type="audio/mpeg">
</audio>
<div class="overlay"></div>

<div class="container">

<h1 class="title" id="typeText"></h1>

<button class="btn" onclick="goMain()">
Let's become a part of their Love Story ❤️
</button>

</div>

<script>

let text = "Welcome to a Beautiful Love Story";
let i = 0;

let container = document.getElementById("typeText");
let sound = document.getElementById("typeSound");

function typeWriter(){

if(i < text.length){

let char = text.charAt(i);

// space handling
if(char === " "){
container.appendChild(document.createTextNode(" "));
}else{

let span = document.createElement("span");
span.className = "word"; // reuse your glass style
span.innerText = char;

container.appendChild(span);

// play sound (safe attempt)
sound.currentTime = 0;

let playPromise = sound.play();

if(playPromise !== undefined){
playPromise.catch(()=>{});
}

}

i++;

setTimeout(typeWriter, 70);

}else{

sound.pause();
sound.currentTime = 0;

}

}

/* AUTO START */
window.onload = function(){
typeWriter();
};

document.addEventListener("click", function(){
sound.play().then(()=>{
sound.pause();
sound.currentTime = 0;
}).catch(()=>{});
}, { once:true });

function goMain(){
window.location.href = "./main.html";
}
</script>

</body>
</html>
