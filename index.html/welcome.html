<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
    /* ===== GLASS WORD STYLE ===== */

.word{
display:inline-block;
margin:3px;
padding:6px 10px;

background:rgba(255,255,255,0.08);
backdrop-filter:blur(6px);
-webkit-backdrop-filter:blur(6px);

border-radius:8px;
border:1px solid rgba(255,255,255,0.2);

box-shadow:0 6px 15px rgba(0,0,0,0.3);

font-family:'Playfair Display',serif;

/* better 3D for letters */
transform:perspective(600px) translateZ(0);
transition:0.3s;
}
.word{
display:inline-flex;
justify-content:center;
align-items:center;

margin:3px;
padding:6px 10px;

font-size:inherit;
line-height:1;

flex-shrink:0;
}

.word:hover{
transform:perspective(800px) rotateX(5deg) rotateY(5deg) scale(1.05);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
font-family:'Playfair Display',serif;
color:white;

}

/* ===== BACKGROUND ===== */

#bgVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

/* soft romantic overlay */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.6));
z-index:-1;
}

/* ===== CENTER CONTENT ===== */

.container{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}
.container{
max-width:95%;
margin:auto;
}
/* ===== TYPEWRITER TEXT ===== */

/* ===== TYPEWRITER TEXT ===== */

.title{

width:100%;
max-width:95vw;

font-size:clamp(1.8rem, 5vw, 3.5rem);

line-height:1.5;
letter-spacing:1px;

text-align:center;
white-space:normal;
word-wrap:break-word;

padding:0 15px;
margin-bottom:40px;

text-shadow:0 10px 30px rgba(0,0,0,0.7);
/* 3D cinematic effect */
transform:perspective(800px) rotateX(8deg);

display:flex;
flex-wrap:wrap;
justify-content:center;
align-items:center;
gap:8px;

}

/* ===== GLASS BUTTON ===== */

.btn{
padding:15px 30px;
font-size:1rem;
border:none;
cursor:pointer;

/* glass effect */
background:rgba(255,255,255,0.08);
backdrop-filter:blur(8px);
border:1px solid rgba(255,255,255,0.2);
color:white;
border-radius:12px;

/* 3D effect */
box-shadow:0 10px 25px rgba(0,0,0,0.4);
transform:perspective(600px) translateY(0);

transition:0.3s;
}

.btn:hover{
transform:translateY(-5px) scale(1.05);
box-shadow:0 20px 40px rgba(0,0,0,0.6);
}
/* =========================
   MOBILE RESPONSIVE
========================= */

@media (max-width: 768px){

body{
overflow-x:hidden;
}

/* Sections */
section{
padding:20px 15px;
}

/* Headings */
h1{
font-size:2rem !important;
line-height:1.3;
}

h2{
font-size:1.5rem !important;
line-height:1.4;
}

p{
font-size:0.95rem !important;
line-height:1.8;
}

/* Buttons */
.btn,
.back-btn{
padding:10px 18px;
font-size:0.9rem;
}

/* Glass cards */
.glass-box,
.letter-box,
.audio-card{
width:95% !important;
padding:20px !important;
}

/* Images */
img{
max-width:100%;
height:auto;
}

/* Teacher Photo */
.teacher-photo{
width:140px !important;
height:140px !important;
}

/* Rain Photos */
.rain-photo{
width:110px !important;
height:150px !important;
}

/* Story text */
#songContent{
font-size:0.95rem !important;
line-height:1.8 !important;
}

/* Fix fixed buttons */
#nextBtn,
#prevBtn,
#homeBtn{
bottom:15px;
}

/* Welcome title */
.title{
white-space:normal !important;
font-size:1.8rem !important;
padding:0 10px;
}

}
</style>
</head>

<body>

<!-- Romantic Background Video -->
<video autoplay muted loop playsinline id="bgVideo">
  <source src="assets/love-bg.mp4" type="video/mp4">
</video>
<audio id="typeSound">
  <source src="assets/typeSound.mp3" type="audio/mpeg">
</audio>
<div class="overlay"></div>

<div class="container">

<h1 class="title" id="typeText"></h1>

<button class="btn" onclick="goMain()">
Let's become a part of their Love Story ❤️
</button>

</div>

<script>

let text = [
"Welcome",
"To A",
"Beautiful",
"Love Story"
];
let i = 0;

let container = document.getElementById("typeText");
let sound = document.getElementById("typeSound");
let soundStarted = false;

function typeWriter(){

if(i < text.length){

let line = document.createElement("div");

line.style.width = "100%";
line.style.display = "flex";
line.style.justifyContent = "center";
line.style.flexWrap = "wrap";
line.style.marginBottom = "10px";

for(let char of text[i]){

if(char === " "){

line.appendChild(document.createTextNode(" "));
continue;

}

let span = document.createElement("span");

span.className = "word";
span.innerText = char;

line.appendChild(span);

}

container.appendChild(line);

if(!soundStarted){

sound.loop = true;

let playPromise = sound.play();

if(playPromise !== undefined){
playPromise.catch(()=>{});
}

soundStarted = true;

}

i++;

setTimeout(typeWriter, 600);

}else{

setTimeout(()=>{

sound.pause();
sound.currentTime = 0;

}, 500);

}

}

/* AUTO START */
window.onload = function(){
typeWriter();
};

document.addEventListener("click", () => {

if(!soundStarted){

sound.volume = 1;

sound.play().then(()=>{

sound.pause();
sound.currentTime = 0;

}).catch(()=>{});

}

}, { once:true });

function goMain(){
window.location.href = "./main.html";
}
</script>

</body>
</html>
